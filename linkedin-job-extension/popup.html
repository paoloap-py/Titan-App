<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Analyzer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LinkedIn Job Analyzer</h1>
      <p class="subtitle">Powered by Claude AI</p>
    </header>

    <div id="api-key-section" class="section">
      <label for="api-key">Claude API Key:</label>
      <div class="input-group">
        <input type="password" id="api-key" placeholder="sk-ant-...">
        <button id="save-key" class="btn btn-small">Save</button>
      </div>
      <p class="hint">Your API key is stored locally and never shared.</p>
    </div>

    <div id="status-section" class="section">
      <div id="page-status" class="status">
        <span class="status-icon">⏳</span>
        <span class="status-text">Checking page...</span>
      </div>
    </div>

    <div id="job-preview" class="section hidden">
      <h3>Detected Job:</h3>
      <div id="job-title" class="job-title"></div>
      <div id="company-name" class="company-name"></div>
    </div>

    <div id="actions" class="section">
      <button id="capture-btn" class="btn btn-primary" disabled>
        <span class="btn-icon">📋</span>
        Capture Job Description
      </button>
      <button id="analyze-btn" class="btn btn-secondary" disabled>
        <span class="btn-icon">🤖</span>
        Analyze with Claude
      </button>
    </div>

    <div id="job-description-section" class="section hidden">
      <h3>Job Description:</h3>
      <textarea id="job-description" rows="6" placeholder="Paste job description here or capture from page..."></textarea>
    </div>

    <div id="analysis-section" class="section hidden">
      <h3>Claude's Analysis:</h3>
      <div id="analysis-result" class="analysis-result"></div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Analyzing with Claude...</span>
    </div>

    <div id="error" class="error hidden"></div>

    <footer>
      <a href="#" id="history-link">View History</a>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
